services:
  - type: web
    name: nwf-inventory-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_DB_NAME
        value: nwf_inventory
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
